<!-- questo è il sito centrale -->

<mat-drawer-container class="sidenav-sistemato" autosize style="height: 100vh; font-family: sans-serif;">
  
  <mat-drawer #drawer mode="side" opened style="width: 250px; background-color: #0cabcb1a; padding: 15px;border-color: blue; border-width: 5px;">
        
    <div>
      <!-- si ricollega al componente sopra per chiuderlo-->
      <button mat-raised-button (click)="drawer.toggle()">
        <mat-icon style="scale: 1.5;">close</mat-icon>
      </button>
    </div>

    <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;">

      <br>

      <li>
        <a routerLink="/kpi-principali" routerLinkActive="classe-attiva" [routerLinkActiveOptions]="{exact: false}">
          KPI principali
        </a>
      </li>

      <br>

      <li>
        <a routerLink="/grafico-acquisti" routerLinkActive="classe-attiva" [routerLinkActiveOptions]="{exact: false}">
          Grafico acquisti
        </a>
      </li>

      <br>

      <li>
        <a routerLink="/grafico-vendite" routerLinkActive="classe-attiva" [routerLinkActiveOptions]="{exact: false}">
           Grafico vendite
        </a>
      </li>

    </ul>
  </mat-drawer>

  <mat-drawer-content>

    <!-- *ngIf ->mette o toglie questo componente sulla base di una condizione -> solo se NON è aperto -->
    <div *ngIf="!drawer.opened" style="margin-top: 18px; margin-left: 18px;">
      <!-- bottone con effetto ombra ma soprattutto fatto  -->
      <button mat-raised-button  (click)="drawer.toggle()">
        <mat-icon style="scale: 1.5;">menu</mat-icon>
      </button>
    </div>

    <router-outlet></router-outlet>
    
  </mat-drawer-content>

</mat-drawer-container>
